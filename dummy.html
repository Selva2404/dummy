<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be Mine?</title>
<style>
  :root{
    --blush: #f7e3e0;
    --blush-deep: #eecbc7;
    --rose: #c9564f;
    --rose-deep: #a83e3a;
    --ink: #3a2a28;
    --cream: #fff8f4;
    --gold: #d9a55c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    background: radial-gradient(ellipse at top, var(--blush) 0%, var(--blush-deep) 60%, #e3b9b4 100%);
    color: var(--ink);
  }

  .sky {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .drift {
    position: absolute;
    bottom: -60px;
    font-size: 22px;
    color: var(--rose);
    opacity: 0.35;
    animation: rise linear infinite;
    user-select: none;
  }

  @keyframes rise {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.35; }
    100% { transform: translateY(-115vh) translateX(var(--drift-x, 20px)) rotate(25deg); opacity: 0; }
  }

  .stage {
    position: relative;
    z-index: 1;
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .eyebrow {
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--rose-deep);
    margin-bottom: 18px;
    font-style: italic;
    opacity: 0.85;
  }

  h1 {
    font-size: clamp(2.1rem, 6vw, 3.6rem);
    font-weight: 500;
    line-height: 1.15;
    margin: 0 0 14px 0;
    color: var(--rose-deep);
    max-width: 14ch;
    text-wrap: balance;
  }

  .sub {
    font-size: clamp(1rem, 2.4vw, 1.2rem);
    color: var(--ink);
    opacity: 0.75;
    margin: 0 0 44px 0;
    max-width: 34ch;
  }

  .buttons {
    position: relative;
    display: flex;
    gap: 22px;
    align-items: center;
    justify-content: center;
    min-height: 90px;
    width: min(90vw, 460px);
  }

  button {
    font-family: inherit;
    font-size: 1.1rem;
    padding: 16px 38px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  #yes {
    background: var(--rose);
    color: var(--cream);
    box-shadow: 0 8px 24px rgba(168, 62, 58, 0.35);
    position: relative;
    z-index: 2;
  }

  #yes:hover {
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 12px 30px rgba(168, 62, 58, 0.45);
  }

  #yes.grown {
    transform: scale(var(--grow, 1));
  }

  #no {
    background: transparent;
    color: var(--rose-deep);
    border: 1.5px solid var(--rose-deep);
    position: relative;
    z-index: 3;
  }

  #no.floating {
    position: fixed;
    transition: left 0.18s ease, top 0.18s ease;
  }

  .result {
    display: none;
    flex-direction: column;
    align-items: center;
    animation: pop 0.5s ease;
  }

  .result.show { display: flex; }

  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .big-heart {
    font-size: 4rem;
    color: var(--rose);
    margin-bottom: 12px;
    animation: beat 1.1s ease-in-out infinite;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  .hidden { display: none !important; }

  .hint {
    margin-top: 28px;
    font-size: 0.85rem;
    color: var(--rose-deep);
    opacity: 0.55;
    font-style: italic;
    min-height: 1.2em;
  }

  @media (prefers-reduced-motion: reduce) {
    .drift, .big-heart, #yes.grown { animation: none !important; }
    #no.floating { transition: none !important; }
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<div class="stage" id="askStage">
  <p class="eyebrow">a small question</p>
  <h1>Will you be mine?</h1>
  <p class="sub">Just this once, the answer's already written in the stars. But you still get to click it.</p>

  <div class="buttons" id="buttonRow">
    <button id="yes" onclick="sayYes()">Yes, always</button>
    <button id="no" onclick="dodge()" onmouseover="dodge()" ontouchstart="dodge(event)">No</button>
  </div>

  <p class="hint" id="hint">&nbsp;</p>
</div>

<div class="stage result" id="resultStage">
  <div class="big-heart">❤</div>
  <h1 id="resultTitle">I knew it.</h1>
  <p class="sub" id="resultSub">You just made this the best day. Forever starts now.</p>
</div>

<script>
  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');
  const askStage = document.getElementById('askStage');
  const resultStage = document.getElementById('resultStage');
  const hint = document.getElementById('hint');

  let dodgeCount = 0;
  let placed = false;

  const teases = [
    "nice try",
    "almost had it",
    "so close",
    "it's shy",
    "keep going",
    "not today",
    "it likes you too much to stay still",
    "you simply cannot catch that one",
  ];

  function placeInitial() {
    const rect = noBtn.getBoundingClientRect();
    noBtn.classList.add('floating');
    noBtn.style.left = rect.left + 'px';
    noBtn.style.top = rect.top + 'px';
    placed = true;
  }

  function randomPosition() {
    const btnRect = noBtn.getBoundingClientRect();
    const w = btnRect.width || 90;
    const h = btnRect.height || 54;
    const margin = 16;
    const maxX = Math.max(margin, window.innerWidth - w - margin);
    const maxY = Math.max(margin, window.innerHeight - h - margin);
    const x = margin + Math.random() * (maxX - margin);
    const y = margin + Math.random() * (maxY - margin);
    return { x, y };
  }

  function growYes() {
    const scale = 1 + Math.min(dodgeCount * 0.04, 0.6);
    yesBtn.classList.add('grown');
    yesBtn.style.setProperty('--grow', scale);
  }

  function dodge(e) {
    if (e) e.preventDefault();
    if (!placed) placeInitial();
    const { x, y } = randomPosition();
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    dodgeCount++;
    growYes();
    hint.textContent = teases[Math.min(dodgeCount - 1, teases.length - 1)];
  }

  function sayYes() {
    askStage.style.display = 'none';
    resultStage.classList.add('show');
    burstHearts();
  }

  function burstHearts() {
    const sky = document.getElementById('sky');
    const symbols = ['❤', '♥', '✿', '❀'];
    for (let i = 0; i < 40; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'drift';
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.setProperty('--drift-x', (Math.random() * 160 - 80) + 'px');
        el.style.fontSize = (16 + Math.random() * 26) + 'px';
        el.style.animationDuration = (4 + Math.random() * 4) + 's';
        sky.appendChild(el);
        setTimeout(() => el.remove(), 9000);
      }, i * 60);
    }
  }

  (function ambient() {
    const sky = document.getElementById('sky');
    const symbols = ['❤', '♥'];
    setInterval(() => {
      const el = document.createElement('div');
      el.className = 'drift';
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.setProperty('--drift-x', (Math.random() * 100 - 50) + 'px');
      el.style.fontSize = (14 + Math.random() * 16) + 'px';
      el.style.animationDuration = (7 + Math.random() * 5) + 's';
      sky.appendChild(el);
      setTimeout(() => el.remove(), 13000);
    }, 1400);
  })();

  window.addEventListener('resize', () => {
    if (placed) {
      const { x, y } = randomPosition();
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }
  });
</script>

</body>
</html>
